apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: insighthub-services
  namespace: insighthub
  labels:
    app: insighthub
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: insighthub
  namespaceSelector:
    matchNames:
      - insighthub
  endpoints:
    - port: http-metrics
      interval: 15s
      path: /metrics
