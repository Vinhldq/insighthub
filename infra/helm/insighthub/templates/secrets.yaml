{{- $env := .Values.global.environment | default "dev" -}}
apiVersion: v1
kind: Secret
metadata:
  name: insighthub-secrets
  namespace: {{ template "insighthub.namespace" . }}
  labels:
{{- include "insighthub.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
{{- if or (eq $env "dev") (eq $env "staging") }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  DEEPSEEK_API_KEY: {{ .Values.secrets.deepseekApiKey | quote }}
{{- end }}
