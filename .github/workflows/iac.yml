name: IaC - Terraform CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'infra/**'
      - '.github/workflows/iac.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'infra/**'

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.9.0
  TERRAFORM_STATE_BUCKET: insighthub-terraform-state

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # Stage 1: Formatting check
  fmt:
    name: Terraform Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v5
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: |
          cd infra
          terraform fmt -check -recursive

  # Stage 2: Linting
  lint:
    name: Terraform Lint
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v5
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v5
        with:
          tflint_version: latest

      - name: TFLint Init
        run: |
          cd infra
          tflint --init

      - name: Run TFLint
        run: |
          cd infra
          tflint --recursive --format compact

  # Stage 3: Security Scanning (Checkov)
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@v3
        with:
          directory: infra/
          soft_fail_on: MEDIUM,LOW
          hard_fail_on: HIGH,CRITICAL
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif

      - name: Upload Checkov results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif
          category: checkov

  # Stage 4: Terraform Validation & Plan
  validate-and-plan:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v5
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          cd infra
          terraform init \
          -backend-config="bucket=${{ env.TERRAFORM_STATE_BUCKET }}" \
          -backend-config="key=insighthub/terraform.tfstate" \
          -backend-config="region=${{ env.AWS_REGION }}" \
          -backend-config="dynamodb_table=terraform-locks" \
          -backend-config="encrypt=true"

      - name: Terraform Validate
        run: |
          cd infra
          terraform validate

      - name: Create tfvars from secrets
        run: |
          cd infra
          cat > terraform.tfvars <<EOF
          aws_region = "${{ env.AWS_REGION }}"
          environment = "${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}"
          cluster_name = "${{ secrets.EKS_CLUSTER_NAME }}"
          vpc_id = "${{ secrets.VPC_ID }}"
          private_subnet_ids = jsondecode("${{ secrets.PRIVATE_SUBNET_IDS }}")
          rds_instance_class = "${{ github.ref == 'refs/heads/main' && 'db.t3.small' || 'db.t3.micro' }}"
          redis_node_type = "${{ github.ref == 'refs/heads/main' && 'cache.t3.small' || 'cache.t3.micro' }}"
          enable_multi_az = ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
          enable_encryption = true
          EOF

      - name: Terraform Plan
        id: plan
        run: |
          cd infra
          terraform plan -out=tfplan -no-color | tee plan-output.txt

      - name: Generate Plan Summary
        if: github.event_name == 'pull_request'
        run: |
          cd infra
          echo "## Terraform Plan Summary" > /tmp/plan-summary.md
          echo "" >> /tmp/plan-summary.md
          echo '```' >> /tmp/plan-summary.md
          tail -20 plan-output.txt >> /tmp/plan-summary.md
          echo '```' >> /tmp/plan-summary.md
          cat /tmp/plan-summary.md

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('/tmp/plan-summary.md', 'utf-8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan

  # Stage 5: Cost Estimation (PR only)
  cost-estimate:
    name: Cost Estimate
    runs-on: ubuntu-latest
    needs: validate-and-plan
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Infracost
        uses: infracost/actions/setup@v2
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost report
        run: |
          cd infra
          infracost breakdown --path . --format table

  # Stage 6: Apply (Manual approval, main branch only)
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [validate-and-plan, cost-estimate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v5
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          cd infra
          terraform init \
          -backend-config="bucket=${{ env.TERRAFORM_STATE_BUCKET }}" \
          -backend-config="key=insighthub/terraform.tfstate" \
          -backend-config="region=${{ env.AWS_REGION }}" \
          -backend-config="dynamodb_table=terraform-locks" \
          -backend-config="encrypt=true"

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra/

      - name: Create tfvars from secrets
        run: |
          cd infra
          cat > terraform.tfvars <<EOF
          aws_region = "${{ env.AWS_REGION }}"
          environment = "prod"
          cluster_name = "${{ secrets.EKS_CLUSTER_NAME }}"
          vpc_id = "${{ secrets.VPC_ID }}"
          private_subnet_ids = jsondecode("${{ secrets.PRIVATE_SUBNET_IDS }}")
          rds_instance_class = "db.t3.small"
          redis_node_type = "cache.t3.small"
          enable_multi_az = true
          enable_encryption = true
          EOF

      - name: Terraform Apply
        run: |
          cd infra
          terraform plan -out=tfplan -no-color
          terraform apply tfplan
        env:
          TF_LOG: INFO
