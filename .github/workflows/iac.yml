name: IaC - Terraform CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'infra/**'
      - '.github/workflows/iac.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'infra/**'
      - '.github/workflows/iac.yml'

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.9.0
  TERRAFORM_STATE_BUCKET: insighthub-terraform-state
  TF_INPUT: false

permissions:
  id-token: write
  contents: read
  pull-requests: write
  security-events: write

jobs:
  fmt:
    name: Terraform Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive ./infra

  lint:
    name: Terraform Lint
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - run: |
          cd infra
          tflint --init
          tflint --recursive --format compact

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install Checkov
        run: pip install checkov
      - name: Run Checkov
        id: checkov
        continue-on-error: true
        run: |
          mkdir -p checkov-results
          checkov \
            --directory infra \
            --framework terraform \
            --soft-fail \
            -o sarif \
            --output-file-path checkov-results/results_sarif.sarif \
            --compact
      - name: Check for HIGH/CRITICAL findings
        run: |
          python3 -c "
          import json, sys
          try:
              with open('checkov-results/results_sarif.sarif') as f:
                  data = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              print('No SARIF report generated')
              sys.exit(0)
          runs = data.get('runs', [])
          total = sum(len(r.get('results', [])) for r in runs)
          print(f'Total Checkov findings: {total}')
          if total > 0:
              for run in runs:
                  for r in run.get('results', []):
                      print(f'  - {r.get(\"ruleId\")}: {r[\"message\"][\"text\"]}')
              sys.exit(1)
          "
      - name: Upload SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov-results/results_sarif.sarif

  validate-and-plan:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform Init
        run: |
          cd infra
          terraform init \
            -backend-config="bucket=${{ env.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=insighthub/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=terraform-locks" \
            -backend-config="encrypt=true"
      - name: Terraform Validate
        run: terraform validate ./infra
      - name: Generate tfvars
        run: |
          cat > infra/terraform.tfvars <<EOF
          aws_region       = "${{ env.AWS_REGION }}"
          environment      = "${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}"
          cluster_name     = "${{ secrets.EKS_CLUSTER_NAME }}"
          vpc_id           = "${{ secrets.VPC_ID }}"
          private_subnet_ids = jsondecode("${{ secrets.PRIVATE_SUBNET_IDS }}")
          rds_instance_class    = "${{ github.ref == 'refs/heads/main' && 'db.t3.small' || 'db.t3.micro' }}"
          rds_allocated_storage = 20
          rds_database_name     = "insighthub"
          rds_master_username   = "insighthub"
          redis_node_type       = "${{ github.ref == 'refs/heads/main' && 'cache.t3.small' || 'cache.t3.micro' }}"
          enable_multi_az       = ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
          enable_encryption     = true
          tags = {
            Project     = "insighthub"
            Environment = "${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}"
            ManagedBy   = "terraform"
          }
          EOF
      - name: Terraform Plan
        id: plan
        run: |
          cd infra
          terraform plan -out=tfplan -no-color | tee plan-output.txt
      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('infra/plan-output.txt', 'utf-8');
            const body = `## Terraform Plan\n\n\`\`\`\n${summary.slice(-3000)}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan
          retention-days: 7

  cost-estimate:
    name: Cost Estimate
    runs-on: ubuntu-latest
    needs: validate-and-plan
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: infracost/actions/setup@v2
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
      - run: |
          cd infra
          infracost breakdown --path . --format table

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: validate-and-plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform Init
        run: |
          cd infra
          terraform init \
            -backend-config="bucket=${{ env.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=insighthub/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=terraform-locks" \
            -backend-config="encrypt=true"
      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra/
      - name: Terraform Apply
        run: |
          cd infra
          terraform apply -auto-approve tfplan
